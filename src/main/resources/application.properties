spring.application.name=hospitua

# ==========================================================
# Base de datos - perfil por defecto: H2 en memoria (desarrollo)
# ==========================================================
spring.datasource.url=jdbc:h2:mem:hospitua;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Ejecuta schema.sql / data.sql al arrancar
spring.sql.init.mode=always

# ==========================================================
# MySQL - activar con:  --spring.profiles.active=mysql
# ==========================================================
