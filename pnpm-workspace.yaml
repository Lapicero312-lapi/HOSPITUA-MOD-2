packages:
  - backend
  - frontend

# Todos usan la versión de Node del CI (.nvmrc y "engines" del package.json raíz): con otra versión,
# pnpm se niega a instalar en vez de solo avisar.
engineStrict: true

# pnpm bloquea por seguridad los scripts de instalación de las dependencias.
# Se ignoran a propósito:
# - @scarf/scarf: solo telemetría (la trae swagger-ui).
# - cpu-features y ssh2: opcionales de testcontainers para conectarse a Docker por SSH; no se usan.
# - protobufjs: su script solo muestra un aviso.
allowBuilds:
  '@scarf/scarf': false
  cpu-features: false
  protobufjs: false
  ssh2: false
