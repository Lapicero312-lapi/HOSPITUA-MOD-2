# Blueprint de Render para la demo del Módulo 2 (plan base, "Despliegue de la demo (Render)").
# Se crea desde el panel de Render: New → Blueprint → este repositorio. Las variables con `sync: false`
# son secretas: Render las pide al crear el Blueprint y solo quedan en su panel, nunca aquí.
#
# Las URL de los servicios (https://<nombre>.onrender.com) salen del nombre. Si Render le da al backend otra
# URL porque el nombre ya estaba ocupado, cámbiala abajo, en la regla /api/* del frontend.

databases:
  - name: hospitua-m2-db
    plan: free
    region: oregon
    databaseName: hospitua
    user: hospitua

services:
  # El backend: aplica las migraciones pendientes y arranca (backend/Dockerfile).
  - type: web
    name: hospitua-m2-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/docs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: hospitua-m2-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: hospitua-m2-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: hospitua-m2-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: hospitua-m2-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: hospitua-m2-db
          property: password
      # Los Módulos 1 y 3. Van aquí y no en el panel: Render vuelve a aplicar estos valores cada vez que
      # sincroniza el Blueprint.
      - key: MODULE1_BASE_URL
        value: https://gestionophospitua.tech
      # Espera máxima al Módulo 1: 2 s en Render (en local sigue en 1 s, el valor del plan). Desde Render, con
      # el Módulo 1 real en otro servidor y un TLS nuevo en cada llamada, 1 s queda justo.
      - key: MODULE1_TIMEOUT_MS
        value: '2000'
      # El Módulo 3 atiende POST /pricing/quotes sin /api.
      - key: MODULE3_BASE_URL
        value: https://hospitua-module-3.onrender.com
      # MODULE1_INTERNAL_KEY y MODULE3_INTERNAL_KEY van en el panel de Render (no aquí), con la clave que cada
      # módulo entrega por privado: se envían en X-Internal-Key. MODULE2_INTERNAL_KEY también va en el panel: es
      # la que el Módulo 2 les exige a ellos; se les entrega por privado y se activa avisándoles antes. El Módulo 1 todavía no la exige y avisa antes de
      # hacerlo; al Módulo 3 avísale antes de agregarla, para que la active al mismo tiempo.
      # El hotel todavía no tiene sus códigos de SIRE: valores de demo.
      - key: SIRE_HOTEL_CODE
        value: DEMO-HOTEL
      - key: SIRE_CITY_CODE
        value: DEMO-CIUDAD
      # Secretos: el RabbitMQ del Módulo 1 y Channex. RABBITMQ_URL es la del broker del Módulo 1
      # (amqps://<usuario>:<clave>@broker.gestionophospitua.tech:5671/%2F, vhost /, solo TLS); el usuario y la
      # clave los entrega el Módulo 1 por privado. Solo la demo se conecta a ese broker.
      - key: RABBITMQ_URL
        sync: false
      - key: CHANNEX_API_KEY
        sync: false
      - key: CHANNEX_PROPERTY_ID
        sync: false

  # El frontend: un sitio estático. /api/* va al backend, como el proxy de Vite en desarrollo (sin CORS).
  - type: web
    name: hospitua-m2-frontend
    runtime: static
    buildCommand: npx --yes pnpm@12.14.0 install --frozen-lockfile --filter frontend && npx --yes pnpm@12.14.0 --filter frontend build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: '22'
    routes:
      - type: rewrite
        source: /api/*
        destination: https://hospitua-m2-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
